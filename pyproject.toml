[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "strain"
version = "0.1.0"
description = "Diagnostic tool for unfair contract clauses"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlmodel>=0.0.18",
    "sentence-transformers>=2.7.0",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "python-levenshtein>=0.25.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["strain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
