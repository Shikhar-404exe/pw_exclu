[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "strain"
version = "0.1.0"
description = "Diagnostic tool for unfair contract clauses"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlmodel==0.0.42",
    "sentence-transformers>=2.7.0",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "python-docx==1.2.0",
    "pdfplumber==0.11.10",
    "python-levenshtein==0.27.5",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["strain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C", "PERF", "PIE", "RUF"]
ignore = [
    "B008",  # FastAPI Depends()/File() in defaults is the framework idiom
    "BLE001",  # intentional never-fail boot warmup (see main.py)
    "E501",  # long lines tolerated (readability over width)
    "RUF001", "RUF002", "RUF003",  # en-dash/× in prose comments and docs
]

[tool.ruff.lint.mccabe]
# Rule-engine functions (feature extraction, topic routing, typed dates)
# are branchy by nature; covered by 88 behaviour tests instead.
max-complexity = 40
